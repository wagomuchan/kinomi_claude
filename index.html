<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7eedb">
  <meta name="description" content="森のどうぶつたちに、ほしい木の実をあげるゲーム">
  <title>木の実をあげよう</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23e0473c' stroke='%234a3326' stroke-width='4'/%3E%3Cpath d='M32 14 L35 4' stroke='%236b4428' stroke-width='4' stroke-linecap='round'/%3E%3Cellipse cx='44' cy='10' rx='9' ry='5' fill='%237cc152' stroke='%234a3326' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="cv"></canvas>

    <button id="soundBtn" class="icon-btn" type="button" aria-label="音を消す">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 12 H11 L18 6 V26 L11 20 H5 Z" class="spk"/>
        <path d="M22 11 Q26 16 22 21" class="wave"/>
        <path d="M25 7 Q32 16 25 25" class="wave"/>
        <path d="M22 11 L30 21 M30 11 L22 21" class="mute"/>
      </svg>
    </button>

    <section id="titleScreen" class="overlay" hidden>
      <div class="card">
        <h1>木の実を<br>あげよう</h1>
        <canvas id="titleArt" width="270" height="96" aria-hidden="true"></canvas>
        <p class="howto">
          どうぶつが ほしがっている<br>
          木の実を ゆびで もって<br>
          はこんで あげよう
        </p>
        <p class="note">まてる じかんが どんどん みじかくなるよ<br>3かい またせすぎたら おしまい</p>
        <label id="debugStart" class="debug" hidden>
          デバッグ：<input id="debugStartInput" type="number" min="0" max="9999" value="0" inputmode="numeric"> 個から
        </label>
        <button id="startBtn" class="btn" type="button">はじめる</button>
        <button id="skipBtn" class="btn skip" type="button" hidden>100こから はじめる</button>
        <p class="best">ベスト <span id="titleBest">0</span></p>
      </div>
    </section>

    <section id="resultScreen" class="overlay" hidden>
      <div class="card">
        <h2>おしまい</h2>
        <p class="result-label">あげた かず</p>
        <p class="result-score"><span id="resultScore">0</span></p>
        <p id="newBest" class="new-best" hidden>ベスト こうしん！</p>
        <p id="unlockMsg" class="unlock-msg" hidden>100こ たっせい！<br>つぎから 100こから はじめられるよ</p>
        <p class="best">ベスト <span id="resultBest">0</span></p>
        <button id="retryBtn" class="btn" type="button">もういちど</button>
        <button id="retrySkipBtn" class="btn skip" type="button" hidden>100こから もういちど</button>
        <button id="toTitleBtn" class="btn sub" type="button">タイトルへ</button>
      </div>
    </section>

    <section id="pauseScreen" class="overlay" hidden>
      <div class="card">
        <h2>ひとやすみ</h2>
        <button id="resumeBtn" class="btn" type="button">つづける</button>
      </div>
    </section>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
